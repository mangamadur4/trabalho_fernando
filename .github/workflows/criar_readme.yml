name: Criar README
on: [push]


jobs:
  create-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar arquivo README-gerado.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Gerado em $(date) pelo usuário ${{ github.actor }}" > README-gerado.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README-gerado.txt
          git commit -m "Adicionar README-gerado" || echo "Sem alterações"
          git push || echo "Push não necessário"