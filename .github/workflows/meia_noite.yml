name: Contar à meia-noite
on:
  schedule:
    - cron: '0 0 * * *'


jobs:
  midnight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contar arquivos à meia-noite
        run: |
          html=$(ls -1 *.html 2>/dev/null | wc -l)
          css=$(ls -1 *.css 2>/dev/null | wc -l)
          js=$(ls -1 *.js 2>/dev/null | wc -l)
          echo "Em $(date -u): html=$html css=$css js=$js"